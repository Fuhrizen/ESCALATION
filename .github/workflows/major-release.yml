name: Major release packages

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: major-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ !github.event.release.draft && !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      eligible: ${{ steps.policy.outputs.eligible }}
      tag: ${{ steps.policy.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read published release history
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
      - name: Validate explicit major release
        id: policy
        env:
          RELEASES_FILE: ${{ runner.temp }}/releases.json
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          event = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          release = event['release']
          tag = release['tag_name']
          match = re.fullmatch(r'v([1-9][0-9]*)\.0\.0', tag)
          output = pathlib.Path(os.environ['GITHUB_OUTPUT'])
          if not match:
              output.write_text('eligible=false\n')
              print('No packages: only explicitly authorized stable vX.0.0 releases (X >= 1) qualify.')
              raise SystemExit(0)
          version = pathlib.Path('VERSION').read_text().strip()
          cmake = re.search(r'project\(Escalation VERSION ([0-9]+\.[0-9]+\.[0-9]+) ', pathlib.Path('CMakeLists.txt').read_text())
          if version != tag[1:] or not cmake or cmake.group(1) != version:
              raise SystemExit('Release tag, VERSION and CMake project version must match exactly.')
          pages = json.loads(pathlib.Path(os.environ['RELEASES_FILE']).read_text())
          releases = [item for page in pages for item in page]
          current = next((item for item in releases if item['id'] == release['id']), None)
          if not current or current['draft'] or current['prerelease'] or current['tag_name'] != tag:
              raise SystemExit('Release is no longer the same published stable release.')
          major = int(match.group(1))
          for previous in releases:
              if previous['id'] == release['id'] or previous['draft'] or previous['prerelease']:
                  continue
              old = re.fullmatch(r'v?([0-9]+)\.[0-9]+\.[0-9]+', previous['tag_name'])
              if old and int(old.group(1)) >= major:
                  raise SystemExit('X must exceed every other published stable release major; republishing an old major is blocked.')
          if current['assets']:
              raise SystemExit('Release already has assets; refusing to rebuild or replace a published package.')
          output.write_text(f'eligible=true\ntag={tag}\n')
          PY

  build:
    needs: validate
    if: needs.validate.outputs.eligible == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: windows-2022
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libegl1 libgl1-mesa-dri
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G 'Visual Studio 17 2022' -A x64 -DBUILD_TESTING=ON
      - name: Build and test
        run: |
          cmake --build build --config Release --parallel 2
          ctest --test-dir build -C Release --output-on-failure
      - name: Render Linux smoke images
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          EGL_PLATFORM: surfaceless
        run: build/escalation --smoke "$RUNNER_TEMP/render-checks"
      - name: Install complete native package
        run: cmake --install build --config Release --prefix "$GITHUB_WORKSPACE/package"
      - name: Check relocatable package data
        run: |
          mv data "$RUNNER_TEMP/source-data"
          trap 'mv "$RUNNER_TEMP/source-data" data' EXIT
          if [ "$RUNNER_OS" = Windows ]; then
            ./package/escalation_headless.exe FRA 0
            test -f package/escalation.exe
          else
            ./package/escalation_headless FRA 0
            test -x package/escalation
          fi
          test -f package/data/world.geojson
          test -f package/data/fonts/DejaVuSans.ttf
          test -f package/THIRD_PARTY_NOTICES.md
      - name: Archive Linux package
        if: runner.os == 'Linux'
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          mkdir archives
          tar -czf "archives/escalation-${RELEASE_TAG}-linux-x86_64.tar.gz" -C package .
      - name: Archive Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          New-Item -ItemType Directory -Path archives
          Compress-Archive -Path package/* -DestinationPath "archives/escalation-$env:RELEASE_TAG-windows-x86_64.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.platform }}
          path: archives/*
          if-no-files-found: error
          retention-days: 7

  attach:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: archives
          merge-multiple: true
      - name: Attach both packages and checksums to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" > "$RUNNER_TEMP/current-release.json"
          python3 - <<'PY'
          import json, os, pathlib
          release = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'current-release.json').read_text())
          if release['draft'] or release['prerelease'] or release['tag_name'] != os.environ['RELEASE_TAG'] or release['assets']:
              raise SystemExit('Release changed or already has assets; upload refused.')
          PY
          cd archives
          test -f "escalation-${RELEASE_TAG}-linux-x86_64.tar.gz"
          test -f "escalation-${RELEASE_TAG}-windows-x86_64.zip"
          sha256sum escalation-* > SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" escalation-* SHA256SUMS.txt
