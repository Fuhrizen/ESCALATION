services:
  linux:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: linux-builder
    environment:
      JOBS: ${JOBS:-4}
    volumes:
      - build-output:/out
      - linux-build:/build
      - dependency-cache:/deps
  windows:
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: windows-builder
    environment:
      JOBS: ${JOBS:-4}
    volumes:
      - build-output:/out
      - windows-build:/build
      - dependency-cache:/deps
volumes:
  linux-build:
  windows-build:
  dependency-cache:
  build-output:
